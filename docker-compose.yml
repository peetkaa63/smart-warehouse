version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://warehouse_user:secure_password@postgres:5432/warehouse_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
      AI_API_KEY: your_ai_api_key
      AI_SERVICE: openai
      GEMINI_API_KEY: AIzaSyDoDNpilsWZ6WKINCX1JZIvmzB0ItDIsOg
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    environment:
      REACT_APP_API_URL: http://rtk.keep-pixel.ru:3000
      REACT_APP_WS_URL: ws://rtk.keep-pixel.ru:3000
    ports:
      - "80:80"
    depends_on:
      - backend

  robot_emulator:
    build: ./robot_emulator
    environment:
      API_URL: http://backend:3000
      ROBOTS_COUNT: 5
      UPDATE_INTERVAL: 10
    depends_on:
      - backend

volumes:
  postgres_data: