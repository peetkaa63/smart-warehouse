name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }} Docker image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, robot_emulator]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build component image
        run: |
          docker build \
            --file "${{ matrix.component }}/Dockerfile" \
            --tag "smart-warehouse-${{ matrix.component }}:ci" \
            "${{ matrix.component }}"
